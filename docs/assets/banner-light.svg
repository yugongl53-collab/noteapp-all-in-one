<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    
    <radialGradient id="glow-indigo-light" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glow-teal-light" cx="80%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#CCFBF1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#CCFBF1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-amber-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="logo-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <linearGradient id="accent-orange-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="card-shadow-light" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#64748B" flood-opacity="0.12"/>
    </filter>
    
    <filter id="logo-shadow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 800; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 500; }
    .body-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 400; }
  </style>

  <!-- Background -->
  <rect width="1280" height="500" rx="16" fill="url(#bg-light)"/>
  <rect width="1280" height="500" rx="16" fill="url(#glow-indigo-light)"/>
  <rect width="1280" height="500" rx="16" fill="url(#glow-teal-light)"/>
  <rect width="1280" height="500" rx="16" fill="url(#glow-amber-light)"/>

  <!-- Subtle Grid Pattern Lines -->
  <g opacity="0.06" stroke="#0F172A" stroke-width="1">
    <line x1="0" y1="100" x2="1280" y2="100"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="500"/>
    <line x1="512" y1="0" x2="512" y2="500"/>
    <line x1="768" y1="0" x2="768" y2="500"/>
    <line x1="1024" y1="0" x2="1024" y2="500"/>
  </g>

  <!-- Brand Header Section -->
  <g transform="translate(80, 50)">
    <!-- Brand App Icon -->
    <g filter="url(#logo-shadow-light)">
      <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#logo-grad-light)"/>
      <!-- Icon Graphic: Stylized N + Pen/Spark -->
      <path d="M24 58 V28 L42 50 V22" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="56" cy="26" r="5.5" fill="url(#accent-orange-light)"/>
      <path d="M56 36 L56 58" stroke="#E0E7FF" stroke-width="5.5" stroke-linecap="round"/>
    </g>

    <!-- Main Title & English Subtitle -->
    <text class="title" x="104" y="44" font-size="36" fill="#0F172A" letter-spacing="1">一站笔记</text>
    <text class="subtitle" x="256" y="44" font-size="22" fill="#64748B" font-weight="600">NoteApp All-in-One</text>
    
    <!-- Slogan -->
    <text class="subtitle" x="105" y="74" font-size="15" fill="#2563EB" letter-spacing="0.5">一站式个人效率工具 · 灵感 · 日程 · 专注 · 统计</text>

    <!-- Tech Badges on the right -->
    <g transform="translate(680, 20)">
      <!-- Badge 1: Android 12+ -->
      <g transform="translate(0, 0)">
        <rect width="112" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="body-font" x="56" y="18" font-size="12" fill="#475569" text-anchor="middle">Android 12+</text>
      </g>
      <!-- Badge 2: Material 3 -->
      <g transform="translate(122, 0)">
        <rect width="108" height="28" rx="14" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
        <text class="body-font" x="54" y="18" font-size="12" fill="#4F46E5" text-anchor="middle">Material 3</text>
      </g>
      <!-- Badge 3: Local First -->
      <g transform="translate(240, 0)">
        <rect width="118" height="28" rx="14" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
        <text class="body-font" x="59" y="18" font-size="12" fill="#0D9488" text-anchor="middle">Local-First 本地优先</text>
      </g>
      <!-- Badge 4: Room & Compose -->
      <g transform="translate(368, 0)">
        <rect width="144" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text class="body-font" x="72" y="18" font-size="12" fill="#475569" text-anchor="middle">Jetpack Compose</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="160" x2="1200" y2="160" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- 5 Core Feature Cards Grid -->
  <g transform="translate(80, 185)">
    <!-- Card 1: 灵感记录 (Quick Note) -->
    <g transform="translate(0, 0)" filter="url(#card-shadow-light)">
      <rect width="210" height="260" rx="18" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#EEF2FF"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">📝</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#0F172A">灵感记录</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#4F46E5" font-weight="600">Quick Note</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#475569">· 闪念即开即记</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#475569">· 标签分类管理</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#475569">· 回收站误删保护</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#475569">· 支持纯文本速记</text>
      <circle cx="185" cy="235" r="4" fill="#6366F1"/>
    </g>

    <!-- Card 2: 学期日程 (Semester Schedule) -->
    <g transform="translate(228, 0)" filter="url(#card-shadow-light)">
      <rect width="210" height="260" rx="18" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#F0F9FF"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">📅</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#0F172A">学期日程</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#0284C7" font-weight="600">Semester Schedule</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#475569">· 学期周课表视图</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#475569">· 单次/循环日程流</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#475569">· 准点系统闹钟提醒</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#475569">· 自定义提前提醒</text>
      <circle cx="185" cy="235" r="4" fill="#0EA5E9"/>
    </g>

    <!-- Card 3: 番茄专注 (Pomodoro Focus) -->
    <g transform="translate(456, 0)" filter="url(#card-shadow-light)">
      <rect width="210" height="260" rx="18" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="1.5"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#FFF1F2"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">🍅</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#0F172A">番茄专注</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#E11D48" font-weight="600">Pomodoro Focus</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#475569">· 沉浸专注倒计时</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#475569">· 专注/休息阶段切换</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#475569">· 后台常驻与中断恢复</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#475569">· 底部全局常驻条</text>
      <circle cx="185" cy="235" r="4" fill="#F43F5E"/>
    </g>

    <!-- Card 4: 随机决策 (Random Decision) -->
    <g transform="translate(684, 0)" filter="url(#card-shadow-light)">
      <rect width="210" height="260" rx="18" fill="#FFFFFF" stroke="#FEF3C7" stroke-width="1.5"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#FFFBEB"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">🎲</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#0F172A">随机决策</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#D97706" font-weight="600">Decision Pool</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#475569">· 待办行动选择池</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#475569">· 等概率/加权抽取</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#475569">· 一键带入番茄专注</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#475569">· 告别选择困难症</text>
      <circle cx="185" cy="235" r="4" fill="#F59E0B"/>
    </g>

    <!-- Card 5: 时间统计 (Time Analytics) -->
    <g transform="translate(912, 0)" filter="url(#card-shadow-light)">
      <rect width="210" height="260" rx="18" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#ECFDF5"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">📊</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#0F172A">时间统计</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#059669" font-weight="600">Time Analytics</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#475569">· 工作/学习/娱乐五类</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#475569">· 日/周精准时长榜</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#475569">· 严谨无重叠校验</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#475569">· JSON 无损备份恢复</text>
      <circle cx="185" cy="235" r="4" fill="#10B981"/>
    </g>
  </g>
</svg>
