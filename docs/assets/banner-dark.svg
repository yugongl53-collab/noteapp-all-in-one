<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    
    <radialGradient id="glow-indigo" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="glow-teal" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-dark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 800; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 500; }
    .body-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', sans-serif; font-weight: 400; }
  </style>

  <!-- Background -->
  <rect width="1280" height="500" rx="16" fill="url(#bg-dark)"/>
  <rect width="1280" height="500" rx="16" fill="url(#glow-indigo)"/>
  <rect width="1280" height="500" rx="16" fill="url(#glow-teal)"/>
  <rect width="1280" height="500" rx="16" fill="url(#glow-rose)"/>

  <!-- Subtle Grid Pattern Lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="1280" y2="100"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="256" y1="0" x2="256" y2="500"/>
    <line x1="512" y1="0" x2="512" y2="500"/>
    <line x1="768" y1="0" x2="768" y2="500"/>
    <line x1="1024" y1="0" x2="1024" y2="500"/>
  </g>

  <!-- Brand Header Section -->
  <g transform="translate(80, 50)">
    <!-- Brand App Icon -->
    <g filter="url(#logo-shadow)">
      <rect x="0" y="0" width="80" height="80" rx="22" fill="url(#logo-grad)"/>
      <!-- Icon Graphic: Stylized N + Pen/Spark -->
      <path d="M24 58 V28 L42 50 V22" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="56" cy="26" r="5.5" fill="url(#accent-orange)"/>
      <path d="M56 36 L56 58" stroke="#E0E7FF" stroke-width="5.5" stroke-linecap="round"/>
    </g>

    <!-- Main Title & English Subtitle -->
    <text class="title" x="104" y="44" font-size="36" fill="#F8FAFC" letter-spacing="1">一站笔记</text>
    <text class="subtitle" x="256" y="44" font-size="22" fill="#94A3B8" font-weight="600">NoteApp All-in-One</text>
    
    <!-- Slogan -->
    <text class="subtitle" x="105" y="74" font-size="15" fill="#38BDF8" letter-spacing="0.5">一站式个人效率工具 · 灵感 · 日程 · 专注 · 统计</text>

    <!-- Tech Badges on the right -->
    <g transform="translate(680, 20)">
      <!-- Badge 1: Android 12+ -->
      <g transform="translate(0, 0)">
        <rect width="112" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text class="body-font" x="56" y="18" font-size="12" fill="#94A3B8" text-anchor="middle">Android 12+</text>
      </g>
      <!-- Badge 2: Material 3 -->
      <g transform="translate(122, 0)">
        <rect width="108" height="28" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
        <text class="body-font" x="54" y="18" font-size="12" fill="#A5B4FC" text-anchor="middle">Material 3</text>
      </g>
      <!-- Badge 3: Local First -->
      <g transform="translate(240, 0)">
        <rect width="118" height="28" rx="14" fill="#1E293B" stroke="#0D9488" stroke-width="1"/>
        <text class="body-font" x="59" y="18" font-size="12" fill="#5EEAD4" text-anchor="middle">Local-First 本地优先</text>
      </g>
      <!-- Badge 4: Room & Compose -->
      <g transform="translate(368, 0)">
        <rect width="144" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
        <text class="body-font" x="72" y="18" font-size="12" fill="#94A3B8" text-anchor="middle">Jetpack Compose</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="80" y1="160" x2="1200" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- 5 Core Feature Cards Grid -->
  <g transform="translate(80, 185)">
    <!-- Card 1: 灵感记录 (Quick Note) -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect width="210" height="260" rx="18" fill="url(#card-dark-grad)" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#6366F1" fill-opacity="0.15"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">📝</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#F8FAFC">灵感记录</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#818CF8" font-weight="600">Quick Note</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#94A3B8">· 闪念即开即记</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#94A3B8">· 标签分类管理</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#94A3B8">· 回收站误删保护</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#94A3B8">· 支持纯文本速记</text>
      <circle cx="185" cy="235" r="4" fill="#6366F1"/>
    </g>

    <!-- Card 2: 学期日程 (Semester Schedule) -->
    <g transform="translate(228, 0)" filter="url(#card-shadow)">
      <rect width="210" height="260" rx="18" fill="url(#card-dark-grad)" stroke="#0EA5E9" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#0EA5E9" fill-opacity="0.15"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">📅</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#F8FAFC">学期日程</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#38BDF8" font-weight="600">Semester Schedule</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#94A3B8">· 学期周课表视图</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#94A3B8">· 单次/循环日程流</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#94A3B8">· 准点系统闹钟提醒</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#94A3B8">· 自定义提前提醒</text>
      <circle cx="185" cy="235" r="4" fill="#0EA5E9"/>
    </g>

    <!-- Card 3: 番茄专注 (Pomodoro Focus) -->
    <g transform="translate(456, 0)" filter="url(#card-shadow)">
      <rect width="210" height="260" rx="18" fill="url(#card-dark-grad)" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#F43F5E" fill-opacity="0.15"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">🍅</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#F8FAFC">番茄专注</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#FB7185" font-weight="600">Pomodoro Focus</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#94A3B8">· 沉浸专注倒计时</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#94A3B8">· 专注/休息阶段切换</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#94A3B8">· 后台常驻与中断恢复</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#94A3B8">· 底部全局常驻条</text>
      <circle cx="185" cy="235" r="4" fill="#F43F5E"/>
    </g>

    <!-- Card 4: 随机决策 (Random Decision) -->
    <g transform="translate(684, 0)" filter="url(#card-shadow)">
      <rect width="210" height="260" rx="18" fill="url(#card-dark-grad)" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">🎲</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#F8FAFC">随机决策</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#FBBF24" font-weight="600">Decision Pool</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#94A3B8">· 待办行动选择池</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#94A3B8">· 等概率/加权抽取</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#94A3B8">· 一键带入番茄专注</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#94A3B8">· 告别选择困难症</text>
      <circle cx="185" cy="235" r="4" fill="#F59E0B"/>
    </g>

    <!-- Card 5: 时间统计 (Time Analytics) -->
    <g transform="translate(912, 0)" filter="url(#card-shadow)">
      <rect width="210" height="260" rx="18" fill="url(#card-dark-grad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Icon Container -->
      <rect x="20" y="20" width="48" height="48" rx="12" fill="#10B981" fill-opacity="0.15"/>
      <text x="44" y="52" font-size="24" text-anchor="middle">📊</text>
      <!-- Text -->
      <text class="title" x="20" y="98" font-size="18" fill="#F8FAFC">时间统计</text>
      <text class="subtitle" x="20" y="118" font-size="12" fill="#34D399" font-weight="600">Time Analytics</text>
      <text class="body-font" x="20" y="148" font-size="12.5" fill="#94A3B8">· 工作/学习/娱乐五类</text>
      <text class="body-font" x="20" y="172" font-size="12.5" fill="#94A3B8">· 日/周精准时长榜</text>
      <text class="body-font" x="20" y="196" font-size="12.5" fill="#94A3B8">· 严谨无重叠校验</text>
      <text class="body-font" x="20" y="220" font-size="12.5" fill="#94A3B8">· JSON 无损备份恢复</text>
      <circle cx="185" cy="235" r="4" fill="#10B981"/>
    </g>
  </g>
</svg>
