<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="pen-tip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#logo-bg)" filter="url(#glow)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="33" y="33" width="446" height="446" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Logo Graphics: N shape + Writing Stroke + Focal Dot -->
  <g transform="translate(64, 64)">
    <!-- Left vertical bar of N -->
    <path d="M72 288 L72 120" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>
    
    <!-- Diagonal stroke of N transitioning into vibrant energy -->
    <path d="M72 120 L208 264" stroke="url(#stroke-grad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right vertical stroke of N -->
    <path d="M208 264 L208 96" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>

    <!-- Accent Pen Tip / Inspiration Spark -->
    <circle cx="280" cy="116" r="24" fill="url(#pen-tip)"/>
    <path d="M280 164 L280 288" stroke="#5EEAD4" stroke-width="34" stroke-linecap="round"/>
  </g>
</svg>
