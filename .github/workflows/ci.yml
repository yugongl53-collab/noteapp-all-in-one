name: CI

# 触发条件：对 main 分支的 push 和 pull_request，以及支持手动触发
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 设置基础权限
permissions:
  contents: read

jobs:
  build-and-test:
    name: 自动化构建与测试
    runs-on: ubuntu-latest

    steps:
      # 检出 Git 仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 配置 JDK 17 构建环境（对应项目 targetCompatibility 与 compileOptions）
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 配置 Gradle 缓存与执行环境
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # 确保 Gradle Wrapper 具备可执行权限
      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      # 检查提交中的空白字符与换行符规范
      - name: 检查 Git Diff 规范
        run: git diff --check

      # 运行单元测试
      - name: 执行本地单元测试
        run: ./gradlew test

      # 运行 Android Lint 静态分析
      - name: 执行 Lint 静态检查
        run: ./gradlew lint

      # 编译 Debug APK 与 Android 仪器测试 APK（验证测试包可构建）
      - name: 编译 Debug APK 与测试 APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # 编译 Release APK（未签名，用于验证 release 配置与混淆可正常编译）
      - name: 编译 Release APK (未签名)
        run: ./gradlew assembleRelease

      # 上传单元测试与 Lint 检查报告
      - name: 上传测试与检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.txt
            app/build/reports/lint-results*.xml
          if-no-files-found: ignore

      # 上传生成的 Debug APK 产物
      - name: 上传 Debug APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noteapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
