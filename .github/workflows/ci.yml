name: CI

# 触发条件：对 main 分支的 push 和 pull_request，以及支持手动触发
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 设置基础权限
permissions:
  contents: read

jobs:
  # Job 1: 代码质量与静态检查（Git Diff 格式规范、Android Lint 分析）
  code-quality:
    name: 代码质量与静态检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      - name: 检查 Git Diff 规范
        run: git diff --check

      - name: 执行 Lint 静态检查
        run: ./gradlew lint

      - name: 上传 Lint 检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.txt
            app/build/reports/lint-results*.xml
          if-no-files-found: ignore

  # Job 2: 本地单元测试（运行纯 Kotlin 与 ViewModel/Repository 等本地单测）
  unit-tests:
    name: 本地单元测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      - name: 执行本地单元测试
        run: ./gradlew test

      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Job 3: APK 构建验证与产物归档（Debug/测试包及未签名 Release 包编译）
  build-artifacts:
    name: APK 构建与产物归档
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 Gradle Wrapper 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK 与测试 APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: 编译 Release APK (未签名)
        run: ./gradlew assembleRelease

      - name: 上传 Debug APK 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: noteapp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
